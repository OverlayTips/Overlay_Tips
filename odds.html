<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds Tracker · Overlay Tips</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
<link rel="icon" type="image/png" sizes="96x96" href="favicon-96.png">
<link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,700;0,900;1,800;1,900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#060807;--panel:#0e1312;--panel2:#121a18;--line:#1b2523;--text:#ecf5f1;--muted:#87978f;--mint:#62f0a8;--mint2:#a8f7cf;--gold:#efd38f;--gold2:#c4953f;--mint-dim:#1d5a3f;--red:#ff6b6b;--amber:#ffc56b}
  *{box-sizing:border-box;margin:0;padding:0}
  html{overflow-x:hidden;overflow-x:clip}
  body{background:var(--bg);color:var(--text);font-family:Archivo,system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(98,240,168,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(98,240,168,.035) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(ellipse at 50% 0%,#000 20%,transparent 75%)}
  main,nav{position:relative;z-index:1}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px}
  .mono{font-family:"Space Mono",monospace;letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--mint)}
  nav{position:sticky;top:0;z-index:20;background:rgba(6,8,7,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
  .brand{display:flex;align-items:center;gap:10px;font-family:"Space Mono",monospace;font-weight:700;letter-spacing:.28em;font-size:13px;white-space:nowrap}
  .brand .wm-o{color:var(--mint2)}
  .brand .wm-t{background:linear-gradient(180deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .brand img{height:30px}
  .back{font-size:14px;color:var(--muted)}
  .back:hover{color:var(--text)}

  header{padding:36px 0 10px}
  h1{font-size:clamp(34px,6vw,54px);font-weight:900;font-style:italic;letter-spacing:-.035em;line-height:.95;margin:10px 0 12px;background:linear-gradient(180deg,var(--gold) 15%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  h1 .g{background:linear-gradient(100deg,var(--mint2),var(--mint));-webkit-background-clip:text;background-clip:text;color:transparent}
  .status{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:14px}
  .status b{color:var(--text);font-weight:700}
  .status .warn{color:var(--amber)}

  .controls{position:sticky;top:58px;z-index:10;background:linear-gradient(var(--bg) 80%,transparent);padding:14px 0 12px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .chips::-webkit-scrollbar{display:none}
  .chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:14px;font-weight:700;white-space:nowrap;color:var(--muted)}
  .chip.on{background:var(--mint2);border-color:var(--mint2);color:#04140c}
  .chip .n{opacity:.6;font-weight:500;margin-left:4px}
  .seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px}
  .seg button{padding:6px 14px;border-radius:999px;font-size:14px;font-weight:700;color:var(--muted)}
  .seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--mint-dim)}
  .search{flex:1 1 180px;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--text);font:inherit;font-size:14px}
  .search:focus{outline:none;border-color:var(--mint-dim)}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer;user-select:none}
  .toggle input{accent-color:var(--mint)}

  .list{display:flex;flex-direction:column;gap:12px;padding:6px 0 80px}
  .ev{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .ev-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
  .ev-title{font-weight:900;font-style:italic;font-size:18px;letter-spacing:-.01em}
  .ev-meta{color:var(--muted);font-size:13px}
  .badges{display:flex;gap:6px;flex-wrap:wrap}
  .badge{font-family:"Space Mono",monospace;font-size:11px;letter-spacing:.08em;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.arb{border-color:var(--mint);color:var(--mint)}
  .badge.live{border-color:var(--red);color:var(--red)}
  .tbl-wrap{overflow-x:auto;border-top:1px solid var(--line)}
  table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
  th,td{padding:9px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  tr:last-child td{border-bottom:0}
  th{font-weight:500;color:var(--muted);font-size:12px;background:var(--panel2)}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1;max-width:170px;overflow:hidden;text-overflow:ellipsis}
  th:first-child{background:var(--panel2)}
  td.best{color:#04140c;background:var(--mint2);font-weight:900}
  td.off{color:#4c5a55}
  td .pt{color:var(--muted);font-size:12px;margin-right:4px}
  td.best .pt{color:#1d5a3f}
  td.bestcol{font-weight:900}
  td.mv{font-size:13px}
  .up{color:var(--mint)} .down{color:var(--red)} .flat{color:var(--muted)}
  .empty{background:var(--panel);border:1px dashed var(--line);border-radius:16px;padding:28px;color:var(--muted)}
  .empty h3{color:var(--text);font-style:italic;font-weight:900;font-size:20px;margin-bottom:8px}
  .empty ol{margin:10px 0 0 20px;display:flex;flex-direction:column;gap:6px}
  .empty code{font-family:"Space Mono",monospace;font-size:12px;color:var(--mint2);background:var(--panel2);padding:1px 6px;border-radius:4px}
  .legend{color:var(--muted);font-size:13px;padding:0 0 10px}
  .gate{min-height:calc(100vh - 58px);display:flex;align-items:center;justify-content:center;padding:40px 0}
  .gate form{width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:14px}
  .gate h2{font-size:30px;font-weight:900;font-style:italic;letter-spacing:-.03em;line-height:1;background:linear-gradient(180deg,var(--gold) 15%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .gate p{color:var(--muted);font-size:14px}
  .gate input[type=password]{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px}
  .gate input[type=password]:focus{outline:none;border-color:var(--mint-dim)}
  .gate .err{color:var(--red);font-size:14px;min-height:1.2em}
  .gbtn{background:var(--mint2);color:#04140c;border-radius:999px;padding:12px 18px;font-weight:900;font-style:italic;font-size:16px}
  .gbtn:disabled{opacity:.6}
  .lock{font-size:14px;color:var(--muted);padding:6px 0}
  .lock:hover{color:var(--text)}
  .navr{display:flex;gap:18px;align-items:center}
  .viewtabs{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;margin-top:20px}
  .viewtabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;padding:10px 6px;border-radius:14px;
    border:1px solid var(--line);background:var(--panel);color:var(--muted);font-weight:800;font-size:13px;line-height:1.1;text-align:center;transition:border-color .15s,background .15s,color .15s}
  .viewtabs button i{font-style:normal;font-size:19px;line-height:1;height:22px;display:flex;align-items:center}
  .viewtabs button i svg{width:22px;height:22px}
  .viewtabs button.on i{color:var(--mint)}
  .viewtabs button i.bdg{font-size:10px;font-weight:900;letter-spacing:.04em;padding:3px 6px;border-radius:6px;border:1px solid var(--mint-dim);color:var(--mint2);height:auto}
  .viewtabs button:hover{color:var(--text);border-color:#26332f}
  .viewtabs button.on{color:var(--text);border-color:var(--mint);background:linear-gradient(160deg,#0f2a1e,var(--panel2) 70%);box-shadow:0 0 0 1px rgba(98,240,168,.15) inset}
  .viewtabs button.on span{color:var(--mint2)}
  @media(max-width:900px){.viewtabs{grid-template-columns:repeat(3,minmax(0,1fr))}.viewtabs button{min-height:60px;font-size:13.5px;white-space:nowrap}.viewtabs button.wide{grid-column:1/-1;flex-direction:row;min-height:48px;gap:8px}}
  @media(max-width:360px){.viewtabs{gap:6px}.viewtabs button{font-size:12px;padding:9px 4px}}
  .seg{overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .seg button{white-space:nowrap}
  tr.grp td{border-top:1px solid #26332f}
  .stakebox{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
  .stakebox select{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 8px;color:var(--text);font:inherit;font-size:14px}
  .stakebox input{width:70px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--text);font:inherit;font-size:14px}
  .bb td,.bb th{text-align:left;white-space:normal;min-width:120px;vertical-align:top}
  .bb td.conv{font-weight:900;font-size:16px;color:var(--mint2);min-width:70px}
  .bb td.conv small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
  .bb .leg{display:block;line-height:1.35}
  .bb .leg b{color:var(--text)}
  .bb .bk{color:var(--muted);font-size:12px}
  .bb a.calc{color:var(--mint);font-size:13px;white-space:nowrap}
  .bb th:first-child,.bb td:first-child{position:static}
  td.fair{color:var(--text)}
  td.bestcol .bbk{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:1px}
  .pin{font-size:9.5px;font-weight:800;letter-spacing:.04em;color:var(--gold,#d6a43c);border:1px solid currentColor;border-radius:4px;padding:0 3px;margin-left:3px;vertical-align:1px}
  td.fair .evp{color:var(--mint);font-size:12px;font-weight:700}
  .topev{border-color:var(--mint-dim)}
  .topev .evp{color:var(--mint2);font-weight:900;font-size:15px}
  .topev td{min-width:90px}
  @media(max-width:640px){
    .topev table,.topev tbody{display:block}
    .topev tr:first-child{display:none}
    .topev tr{display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-areas:"edge bet price" "edge game fair";gap:4px 12px;padding:12px 14px;border-bottom:1px solid var(--line)}
    .topev table.arbt tr{grid-template-areas:"edge bet bet" "edge game game"}
    .topev tr:last-child{border-bottom:0}
    .topev td{display:block;padding:0;border:0;min-width:0;white-space:normal;text-align:left}
    .topev td.c-edge{grid-area:edge}
    .topev td.c-bet{grid-area:bet}
    .topev td.c-price{grid-area:price;text-align:right;white-space:nowrap}
    .topev td.c-fair{grid-area:fair;text-align:right;white-space:nowrap;color:var(--muted);font-size:13px}
    .topev td.c-fair::before{content:"fair "}
    .topev td.c-fair.others::before{content:"others "}
    .topev td.c-fair .bk{display:none}
    .topev .mvt td.c-fair::before{content:"best "}
    .topev td.c-game{grid-area:game;font-size:13px;color:var(--muted)}
  }
  .sharebar{display:inline-flex;gap:6px}
  .sharebtn{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-weight:800;font-size:14px;color:var(--text);white-space:nowrap}
  .sharebtn{display:inline-flex;align-items:center;gap:6px}
  .sharebtn.wa{background:#25d366;border-color:#25d366;color:#04140c}
  .swipe{display:none}
  @media(max-width:640px){
    .ev table:not(.bb) th:first-child,.ev table:not(.bb) td:first-child{white-space:normal;max-width:none;min-width:132px;width:42%;overflow:visible;line-height:1.3;box-shadow:6px 0 8px -6px rgba(0,0,0,.6)}
    .ev table:not(.bb) td:first-child .pt{display:block;margin-top:2px}
    .swipe{display:block;font-size:12px;color:var(--muted);padding:0 16px 8px;text-align:right}
    .controls{position:static;background:none}
    .ev table:not(.bb) th:nth-child(4),.ev table:not(.bb) td.mv{display:none}
  }
  .chk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .chk h3{font-size:20px;font-weight:800}
  .chk label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}
  .chk input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--text);font:inherit;font-size:16px}
  .chk input:focus{outline:none;border-color:var(--mint-dim)}
  .chk-res{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
  .chk-res button{text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
  .chk-res button.on{border-color:var(--mint)}
  .chk-res .bk{display:block;font-size:12px}
  .chk-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .verdict{border-radius:12px;padding:16px;border:1px solid var(--line);background:var(--panel2)}
  .verdict b.big{display:block;font-size:30px;font-weight:900;line-height:1.1}
  .verdict.good{border-color:var(--mint)} .verdict.good b.big{color:var(--mint)}
  .verdict.bad{border-color:#5a2a2a} .verdict.bad b.big{color:var(--red)}
  .verdict p{color:var(--muted);font-size:14px;margin-top:6px}
  [hidden]{display:none!important}
</style>

<body>
<nav>
  <div class="wrap">
    <a href="index.html" class="brand"><img src="logo-mark.png" alt=""><span class="wm-o">OVERLAY</span> <span class="wm-t">TIPS</span></a>
    <div class="navr"><button class="lock" id="lockBtn" hidden>Lock</button><a href="index.html" class="back">← Site</a></div>
  </div>
</nav>

<section class="gate wrap" id="gate">
  <form id="gateForm" autocomplete="on">
    <div class="mono">Members only</div>
    <h2>Odds tracker</h2>
    <p>Enter the password to unlock.</p>
    <input type="text" name="username" value="overlay-odds" autocomplete="username" hidden>
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
    <label class="toggle"><input type="checkbox" id="remember" checked> Remember on this device</label>
    <div class="err" id="gateErr"></div>
    <button class="gbtn" id="gateBtn" type="submit">Unlock</button>
  </form>
</section>

<main class="wrap" id="app" hidden>
  <header>
    <div class="mono">Password protected</div>
    <h1>Odds <span class="g">tracker</span></h1>
    <div class="status" id="status"></div>
    <div class="viewtabs" id="views">
      <button data-v="chk" class="wide"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/><path d="M8.5 11l1.8 1.8 3.4-3.6"/></svg></i><span>Check a price</span></button>
      <button data-v="ev"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l5-5 4 4 8-9"/><path d="M14 7h6v6"/></svg></i><span>Top EV</span></button>
      <button data-v="arb"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M7 20h10M5 7h14"/><path d="M5 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/><path d="M19 7l-2.5 6a2.5 2.5 0 0 0 5 0z"/></svg></i><span>Arbs</span></button>
      <button data-v="pp"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".9" fill="currentColor"/></svg></i><span>Prop picks</span></button>
      <button data-v="mv"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M7 4l-3 3M7 4l3 3"/><path d="M17 20V4M17 20l-3-3M17 20l3-3"/></svg></i><span>Movers</span></button>
      <button data-v="bk:sportsbet"><i class="bdg">SB</i><span>Sportsbet</span></button>
      <button data-v="bk:tab"><i class="bdg">TAB</i><span>TAB</span></button>
      <button data-v="games" class="on"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14"/><circle cx="12" cy="12" r="2.5"/></svg></i><span>Games</span></button>
      <button data-v="props"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></i><span>All props</span></button>
      <button data-v="bonus"><i><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="9" width="17" height="11" rx="1.5"/><path d="M2.5 9h19M12 9v11"/><path d="M12 9c-1.5-3.5-5.5-4-5.5-1.5S10 9 12 9zM12 9c1.5-3.5 5.5-4 5.5-1.5S14 9 12 9z"/></svg></i><span>Bonus bets</span></button>
    </div>
  </header>

  <div class="controls">
    <div class="chips" id="sports"></div>
    <div class="row">
      <div class="seg" id="markets"></div>
      <input class="search" id="q" type="search" placeholder="Search team">
      <label class="toggle" id="moversBox"><input type="checkbox" id="movers"> Movers first</label>
      <label class="stakebox" id="stakeBox" hidden><span id="stakeLbl">Bonus bet $</span><input id="bstake" type="number" inputmode="decimal" min="1" step="any" value="50"></label>
      <span class="sharebar" id="shareBar" hidden><button class="sharebtn wa" id="waBtn" type="button"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:18px;height:18px"><path d="M4 19l1.4-3.6A7.5 7.5 0 1 1 8 18.2z"/></svg>Post to WhatsApp</button><button class="sharebtn" id="copyBtn" type="button">Copy</button></span>
      <label class="stakebox" id="evtBox" hidden>Show<select id="evtSel"><option value="all">Everything</option><option value="props">Player overs/unders</option><option value="games">Game markets</option></select></label>
      <label class="stakebox" id="mvBox" hidden>Show<select id="mvSel"><option value="all">Steamers + drifters</option><option value="steam">Steamers (shortening)</option><option value="drift">Drifters (lengthening)</option></select></label>

/* ---------- unlock ---------- */
async function decrypt(bundle,pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(bundle.salt),iterations:bundle.iter,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const gz=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(bundle.iv)},key,b64(bundle.ct));
  const txt=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(txt);
}
async function fetchBundle(){
  const r=await fetch(BASE+'data.json?t='+Math.floor(Date.now()/60000));
  if(!r.ok) throw new Error('nodata');
  return r.json();
}
async function unlock(pw,quiet){
  let bundle;
  try{ bundle=await fetchBundle(); }catch(e){ if(!quiet) $('gateErr').textContent='No odds data published yet.'; return false; }
  if(!bundle.v){ if(!quiet) $('gateErr').textContent='Odds are paused: the page password hasn\'t been set up in GitHub yet.'; return false; }
  try{ DATA=await decrypt(bundle,pw); CHK_IDX=null; }catch(e){ if(!quiet) $('gateErr').textContent='Wrong password.'; return false; }
  $('gate').hidden=true; $('app').hidden=false; $('lockBtn').hidden=false;
  render(); return true;
}
$('gateForm').onsubmit=async e=>{

  const pw=$('pw').value;

  $('gateBtn').disabled=false; $('gateBtn').textContent='Unlock';
};

(async()=>{const pw=store.get('pw',null); if(pw && !(await unlock(pw,true))) store.del('pw');})();
setInterval(async()=>{const pw=store.get('pw',null); if(DATA&&pw) unlock(pw,true);},10*60*1000);

/* ---------- tables ---------- */
function sideOf(o){return {key:(o.description?o.description+'|':'')+o.name, desc:o.description||null, name:o.name}}
function eventRows(ev, mk){
  const books=ev.bookmakers.filter(b=>b.markets.some(m=>m.key===mk));
  if(!books.length) return null;
  const sides=[], seen={};
  books.forEach(b=>b.markets.find(m=>m.key===mk).outcomes.forEach(o=>{const s=sideOf(o); if(!seen[s.key]){seen[s.key]=1;sides.push(s);}}));
  if(sides.some(s=>s.desc)) sides.sort((a,b)=>a.desc.localeCompare(b.desc)||(a.name==='Over'?-1:b.name==='Over'?1:0));
  const IDX={}; books.forEach(b=>{const m={}; b.markets.find(x=>x.key===mk).outcomes.forEach(o=>{const k=sideOf(o).key;(m[k]=m[k]||[]).push(o);}); IDX[b.key]=m;});
  const outsOf=(b,s)=>IDX[b.key][s.key]||[];
  // main line: bookies often send ladders (Over 14.5, 19.5, 24.5...). Prefer the line most bookies price on
  // BOTH sides, then the most bookies, then the price closest to evens.
  const main={};
  sides.forEach(s=>{
    const pts={}; books.forEach(b=>outsOf(b,s).forEach(o=>{ if(o.point!=null)(pts[o.point]=pts[o.point]||{})[b.key]=o.price; }));
    const opps=sides.filter(x=>x.desc===s.desc&&x.key!==s.key);
    let bestP=null,bestScore=null;
    Object.keys(pts).forEach(k=>{const p=+k, bk=pts[k];
      let paired=0; opps.forEach(op=>{const want=mk==='spreads'?-p:p; let n=0;
        books.forEach(b=>{ if(bk[b.key]!=null&&outsOf(b,op).some(o=>o.point===want)) n++; }); paired=Math.max(paired,n);});
      const pr=Object.values(bk).sort((a,b)=>a-b), med=pr[pr.length>>1];
      const sc=[paired,pr.length,-Math.abs(med-1.91)];
      if(!bestScore||sc[0]>bestScore[0]||(sc[0]===bestScore[0]&&(sc[1]>bestScore[1]||(sc[1]===bestScore[1]&&sc[2]>bestScore[2])))){bestScore=sc;bestP=p;}
    });
    if(bestP!=null) main[s.key]=bestP;
  });
  const pick=(b,s)=>{const os=outsOf(b,s); if(!os.length) return null; if(main[s.key]==null) return os[0];
    return os.find(o=>o.point===main[s.key])||os.reduce((a,o)=>Math.abs(o.point-main[s.key])<Math.abs(a.point-main[s.key])?o:a);};
  const hist=DATA.history?.events?.[ev.id]?.series||{};
  const rows=sides.map(s=>{
    const cells=books.map(b=>{const o=pick(b,s);return o?{price:o.price,point:o.point,ok:o.point==null||o.point===main[s.key]}:null;});
    const ok=cells.filter(c=>c&&c.ok).map(c=>c.price);
    const best=ok.length?Math.max(...ok):NaN;
    const mvOf=sr=>{ if(!sr||sr.length<2) return null; const a=sr[0],z=sr[sr.length-1]; return {from:a[1],to:z[1],fp:a[3],tp:z[3],pct:(z[1]-a[1])/a[1]*100}; };
    const mvMain=s.desc?mvOf(hist[mk+'|'+s.key+'|main']):null;
    const ser=hist[mk+'|'+s.key+(s.desc?'|'+main[s.key]:'')]; let mv=null;
    if(ser&&ser.length>1){const a=ser[0],z=ser[ser.length-1];mv={from:a[1],to:z[1],fp:a[3],tp:z[3],pct:(z[1]-a[1])/a[1]*100};}
    const bi=cells.findIndex(c=>c&&c.ok&&c.price===best);
    return {s,cells,best,bestBook:bi>=0?books[bi]:null,point:main[s.key],mv,mvMain};
  });
  // fair price: strip each bookie's margin (no-vig) across the sides of a market, take the median across bookies
  const groups={}; rows.forEach(r=>(groups[r.s.desc||'']=groups[r.s.desc||'']||[]).push(r));
  const sm=ev.sharp&&ev.sharp.markets.find(m=>m.key===mk);
  Object.values(groups).forEach(g=>{
    if(g.length<2) return;
    // sharp (Pinnacle) de-vigged price at the same line wins when it's available
    if(sm){
      const so=g.map(r=>sm.outcomes.find(o=>o.name===r.s.name&&(o.description||'')===(r.s.desc||'')&&(o.point??null)===(r.point??null)));
      if(so.every(Boolean)){
        const inv=so.map(o=>1/o.price), tot=inv.reduce((a,c)=>a+c,0);
        g.forEach((r,k)=>{const p=inv[k]/tot; r.fair=1/p; r.edge=isFinite(r.best)?(r.best*p-1)*100:null; r.nfair=99; r.fairSrc='pin';});
        return;
      }
    }
    const probs=g.map(()=>[]);
    books.forEach((b,i)=>{
      if(!g.every(r=>r.cells[i]&&r.cells[i].ok)) return;
      const inv=g.map(r=>1/r.cells[i].price), tot=inv.reduce((a,c)=>a+c,0);
      inv.forEach((v,k)=>probs[k].push(v/tot));
    });
    if(probs[0].length<3) return;
    const med=a=>{a=[...a].sort((x,y)=>x-y);const m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2;};
    g.forEach((r,k)=>{const p=med(probs[k]); r.fair=1/p; r.edge=isFinite(r.best)?(r.best*p-1)*100:null; r.nfair=probs[k].length;});
  });
  const pct=rows.reduce((t,r)=>t+(isFinite(r.best)?100/r.best:0),0);
  return {books,rows,pct};
}

function render(){

  if(isK){ renderBook(); return; }
  if(isE){ renderEV(); return; }
  if(isP){ renderPropPicks(); return; }

  const evs = view==='games'?O.events:P.events;

  if(sport!=='all'&&!counts[sport]) sport='all';
  $('sports').innerHTML=[['all',evs.length],...Object.entries(counts)].map(([s,n])=>
    `<button class="chip ${s===sport?'on':''}" data-s="${esc(s)}">${s==='all'?'All':esc(s)}<span class="n">${n}</span></button>`).join('');
  $('sports').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sport=b.dataset.s;store.set('sport',sport);render();});

  const inSport=evs.filter(e=>sport==='all'||e.sport_title===sport);
  let markets;
  if(view==='games') markets=GAME_MKTS;
  else{ const ks=[]; inSport.forEach(e=>e.bookmakers.forEach(b=>b.markets.forEach(m=>{if(!ks.includes(m.key))ks.push(m.key);})));
        markets=ks.map(k=>[k,PROP_LABEL[k]||k.replace(/^player_/,'').replace(/_/g,' ')]); }
  let market=mkt[view];
  if(!markets.some(m=>m[0]===market)) market=mkt[view]=markets[0]?.[0]||null;
  $('markets').innerHTML=markets.map(([k,l])=>`<button data-m="${k}" class="${k===market?'on':''}">${esc(l)}</button>`).join('');
  $('markets').querySelectorAll('button').forEach(b=>b.onclick=()=>{mkt[view]=b.dataset.m;store.set(view==='games'?'market':'pmarket',b.dataset.m);render();});
  $('movers').checked=movers;
  $('q').placeholder=view==='games'?'Search team':'Search team or player';
  $('legend').textContent=view==='games'
    ?'Fair = the true price with the bookie margin taken out: Pinnacle’s de-vigged line where it has one (PIN), otherwise the median of the Aussie bookies. Any bookie paying more than Fair is +EV, e.g. check bet365 against it. Mint cell = best price at the main line. Open → now tracks the best price since the tracker first saw the game. Market % under 100 = arb across bookies.'
    :'Fair = the true price with the margin taken out: Pinnacle’s de-vigged line where it has one (PIN), otherwise the Aussie bookies. If bet365 (or any bookie) pays more than Fair at the same line, it\'s +EV. Mint = best price at the most common line. Props refresh 3× a day.';

  if(view==='props' && !P.events.length){
    $('list').innerHTML=`<div class="empty"><h3>No player props yet</h3>Props get pulled for every sport's games starting in the next 24 hours. If this stays empty, the Aussie bookies on the odds feed aren't offering props for these games yet.</div>`; return;
  }
  const q=$('q').value.trim().toLowerCase();
  let items=inSport.map(e=>({e,t:market&&eventRows(e,market)})).filter(x=>x.t);
  if(q) items=items.map(x=>{
    const teamHit=(x.e.home_team+' '+x.e.away_team).toLowerCase().includes(q);
    if(teamHit) return x;
    if(view==='props'){const rows=x.t.rows.filter(r=>(r.s.desc||'').toLowerCase().includes(q)); return rows.length?{e:x.e,t:{...x.t,rows}}:null;}
    return null;
  }).filter(Boolean);
  const maxMove=x=>Math.max(0,...x.t.rows.map(r=>r.mv?Math.abs(r.mv.pct):0));
  const maxEdge=x=>Math.max(-99,...x.t.rows.map(r=>r.edge??-99));
  if(movers) items.sort((a,b)=>maxMove(b)-maxMove(a));
  else if(view==='props') items.sort((a,b)=>maxEdge(b)-maxEdge(a));
  const top='';
  if(!items.length){$('list').innerHTML=`<div class="empty"><h3>Nothing here</h3>No games with this market${q?' matching “'+esc(q)+'”':''} right now.</div>`;return;}

  $('list').innerHTML=items.map(({e,t})=>{
    const started=new Date(e.commence_time)<new Date();

      ${view==='games'?`<span class="badge ${t.pct<100?'arb':''}">MKT ${t.pct.toFixed(1)}%${t.pct<100?' · ARB':''}</span>`:''}
      <span class="badge">${t.books.length} books</span></div></div>`;
    const first=view==='props'?'Player':market==='h2h'?'Team':market==='spreads'?'Line':'Total';
    const th=`<tr><th>${first}</th><th>Best</th><th title="True price with the bookie margin removed">Fair</th><th>Open → now</th>${t.books.map(b=>`<th>${esc(bkName(b))}</th>`).join('')}</tr>`;
    let prev=null;
    const trs=t.rows.map(r=>{
      const nm=r.s.desc?`${esc(r.s.desc)} <span class="pt">${esc(r.s.name)}${r.point!=null?' '+r.point:''}</span>`
                       :esc(r.s.name)+(r.point!=null?` <span class="pt">${fmtPt(market,r.point)}</span>`:'');
      const grp=r.s.desc&&prev!==null&&prev!==r.s.desc; prev=r.s.desc;
      let mv='<span class="flat">–</span>';
      if(r.mv){const cls=r.mv.pct<-0.5?'down':r.mv.pct>0.5?'up':'flat',ar=r.mv.pct<-0.5?'▼':r.mv.pct>0.5?'▲':'•';
        const pm=(r.mv.fp!=null&&r.mv.fp!==r.mv.tp)?`${fmtPt(market,r.mv.fp)}→${fmtPt(market,r.mv.tp)} `:'';
        mv=`<span class="${cls}">${pm}${r.mv.from.toFixed(2)} → ${r.mv.to.toFixed(2)} ${ar}${Math.abs(r.mv.pct).toFixed(0)}%</span>`;}
      const cells=r.cells.map(c=>{if(!c)return'<td class="off">–</td>';
        const pt=(c.point!=null&&!c.ok)?`<span class="pt">${fmtPt(market,c.point)}</span>`:'';
        return `<td class="${c.ok&&c.price===r.best?'best':c.ok?'':'off'}">${pt}${c.price.toFixed(2)}</td>`;}).join('');
      return `<tr class="${grp?'grp':''}"><td>${nm}</td><td class="bestcol">${isFinite(r.best)?r.best.toFixed(2)+(r.bestBook?`<span class="bbk">${esc(bkName(r.bestBook))}</span>`:''):'–'}</td><td class="fair">${r.fair?r.fair.toFixed(2)+(r.fairSrc==='pin'?' <span class="pin">PIN</span>':'')+(r.edge>0.5?` <span class="evp">+${r.edge.toFixed(1)}%</span>`:''):'–'}</td><td class="mv">${mv}</td>${cells}</tr>`;
    }).join('');
    return `<div class="ev">${head}<div class="swipe">Swipe for every bookie →</div><div class="tbl-wrap"><table>${th}${trs}</table></div></div>`;
  }).join('');
  if(top) $('list').insertAdjacentHTML('afterbegin',top);
}

let SHARE=[];

function shareLine(e,mk,o,price,book){

function shareText(){
  if(!SHARE.length) return '';

/* highest +EV props across every market, best first */
function topEV(evs,q,o={}){
  const limit=o.limit||25;
  const now=new Date(), out=[];
  evs.forEach(e=>{
    if(new Date(e.commence_time)<=now) return;
    const mks=[...new Set(e.bookmakers.flatMap(b=>b.markets.map(m=>m.key)))].filter(k=>!k.endsWith('_lay'));
    mks.forEach(mk=>{const t=eventRows(e,mk); if(!t) return;
      t.rows.forEach(r=>{ if(!r.fair||r.nfair<3) return;
        if(o.type==='props'&&!(r.s.desc&&r.point!=null)) return; if(o.type==='games'&&r.s.desc) return; const pk=o.noBook?(r.bestBook?{price:r.best,book:r.bestBook}:null):pickPrice(t,r); if(!pk) return;
        const edge=(pk.price/r.fair-1)*100;
        if(edge>0.5&&(!q||((r.s.desc||'')+' '+e.home_team+' '+e.away_team).toLowerCase().includes(q)))
        out.push({e,mk,r,pk,edge}); });});
  });
  out.sort((a,b)=>b.edge-a.edge);
  if(!o.noBook) out.slice(0,5).forEach(({e,mk,r,pk})=>SHARE.push(shareLine(e,mk,{desc:r.s.desc,name:r.s.name,point:r.point},pk.price,pk.book)));
  if(!out.length) return o.empty||'';
  const rows=out.slice(0,limit).map(({e,mk,r,pk,edge})=>`<tr>
    <td class="c-edge"><span class="evp">+${edge.toFixed(1)}%</span></td>
    <td class="c-bet">${r.s.desc?esc(r.s.desc)+' <span class="pt">'+esc(r.s.name)+(r.point!=null?' '+r.point:'')+'</span>':esc(r.s.name)+(r.point!=null?' <span class="pt">'+fmtPt(mk,r.point)+'</span>':'')}<br><span class="bk">${esc(MKT_LABEL[mk]||PROP_LABEL[mk]||mk)}</span></td>
    <td class="c-price"><b>${pk.price.toFixed(2)}</b> <span class="bk">${esc(bkName(pk.book))}</span></td>
    <td class="c-fair">${r.fair.toFixed(2)}${r.fairSrc==='pin'?' <span class="pin">PIN</span>':''}</td>
    <td class="c-game">${esc(e.home_team)} v ${esc(e.away_team)}<br><span class="bk">${esc(e.sport_title)} · ${when(e.commence_time)}</span></td></tr>`).join('');
  return `<div class="ev topev"><div class="ev-head"><div><div class="ev-title">${o.title||'Top +EV props right now'}${o.noBook?'':esc(myName())}</div>
    <div class="ev-meta">${o.meta||'Every prop market, ranked by edge vs the fair price.'} ${out.length>limit?'Top '+limit+' of '+out.length:out.length+' found'}.</div></div></div>
    <div class="tbl-wrap"><table class="bb"><tr><th>Edge</th><th>Bet</th><th>Best price</th><th>Fair</th><th>Game</th></tr>${rows}</table></div></div>`;
}

/* ---------- bonus bet conversions (stake not returned) ---------- */
let bbook=store.get('bbook','all'), bprops=store.get('bprops',false);
function conversions(evs){
  const now=new Date(), out=[];
  evs.forEach(ev=>{
    if(new Date(ev.commence_time)<=now) return;
    const byMkt={};
    ev.bookmakers.forEach(b=>b.markets.forEach(m=>{
      if(m.key.endsWith('_lay')) return;
      m.outcomes.forEach(o=>(byMkt[m.key]=byMkt[m.key]||[]).push({book:b,name:o.name,desc:o.description||'',point:o.point,price:o.price}));
    }));
    Object.entries(byMkt).forEach(([mk,outs])=>{
      const best={};
      outs.forEach(c=>{
        if(c.book.key==='betfair_ex_au'||c.price<1.5) return;
        const names=[...new Set(outs.filter(o=>o.desc===c.desc).map(o=>o.name))].filter(n=>n!==c.name);
        if(!names.length) return;
        const legs=[];
        for(const n of names){
          const ok=outs.filter(o=>o.desc===c.desc&&o.name===n&&o.book.key!==c.book.key&&o.book.key!=='betfair_ex_au'&&
            (c.point==null||(mk==='spreads'?o.point===-c.point:o.point===c.point)));
          if(!ok.length) return;
          legs.push(ok.reduce((a,b)=>b.price>a.price?b:a));
        }
        const conv=(c.price-1)*(1-legs.reduce((t,l)=>t+1/l.price,0));
        const k=c.book.key+'|'+c.desc;
        if(!best[k]||conv>best[k].conv) best[k]={ev,mk,c,legs,conv};
      });
      Object.values(best).forEach(x=>out.push(x));
    });
  });
  return out.sort((a,b)=>b.conv-a.conv);
}

  $('q').placeholder='Search team or player';
  $('legend').textContent='Pick the bookie your bonus bet is with. Bet the bonus on the first leg, hedge with cash on the other side at a different bookie. % = how much of the bonus you keep as cash, whatever happens. Odds are from the last update, so check them before you bet. Betfair is left out (commission).';
  const q=$('q').value.trim().toLowerCase();
  let rows=all.filter(x=>(bbook==='all'||x.c.book.key===bbook)&&

  const trs=rows.map(x=>{

    const calc=x.legs.length===1?`<a class="calc" href="calculator.html?mode=bb&stake=${S}&o1=${A}&o2=${x.legs[0].price}">Calculator →</a>`:'';
    return `<tr><td class="conv">${(x.conv*100).toFixed(1)}%<small>$${(S*x.conv).toFixed(2)} cash</small></td>
      <td><span class="leg"><b>$${S.toFixed(0)} bonus</b> on ${sel(x,x.c)} @ <b>${A.toFixed(2)}</b> <span class="bk">${esc(bkName(x.c.book))}</span></span></td>

/* ---------- arbitrage: best prices across bookies that add up to under 100% ---------- */
function findArbs(evs){
  const now=new Date(), out=[];
  evs.forEach(ev=>{
    if(new Date(ev.commence_time)<=now) return;
    const groups={};
    ev.bookmakers.forEach(b=>{ if(b.key==='betfair_ex_au') return;
      b.markets.forEach(m=>{ if(m.key.endsWith('_lay')) return;
        m.outcomes.forEach(o=>{
          let gk, side=o.name;
          if(m.key==='spreads'){ if(o.point==null) return; gk=(o.name===ev.home_team?o.point:-o.point); }
          else if(o.point!=null) gk=o.point; else gk='';
          const key=m.key+'|'+(o.description||'')+'|'+gk;
          const g=groups[key]=groups[key]||{mk:m.key,desc:o.description||'',sides:{}};
          const cur=g.sides[side];
          if(!cur||o.price>cur.price) g.sides[side]={price:o.price,book:b,point:o.point,name:o.name};
        });});});
    // how many sides each market should have (h2h: every team/draw name seen; others: 2)
    const h2hNames={}; ev.bookmakers.forEach(b=>b.markets.forEach(m=>{ if(m.key==='h2h') m.outcomes.forEach(o=>h2hNames[o.name]=1); }));
    Object.values(groups).forEach(g=>{
      const legs=Object.values(g.sides);
      const need=g.mk==='h2h'?Object.keys(h2hNames).length:2;
      if(legs.length<2||legs.length!==need) return;
      const sum=legs.reduce((t,l)=>t+1/l.price,0);
      if(sum<1) out.push({ev,mk:g.mk,desc:g.desc,legs,sum,margin:(1/sum-1)*100});
    });
  });
  return out.sort((a,b)=>b.margin-a.margin);
}

function ppHTML(evs,q){
  const now=new Date(), out=[];
  evs.filter(e=>new Date(e.commence_time)>now).forEach(e=>{
    const mks=[...new Set(e.bookmakers.flatMap(b=>b.markets.map(m=>m.key)))].filter(k=>!k.endsWith('_lay'));
    mks.forEach(mk=>{const t=eventRows(e,mk); if(!t) return;
      t.rows.forEach(r=>{
        if(r.point==null) return; const pk=pickPrice(t,r); if(!pk||!(pk.price<=maxOdds)) return;
        const bi=pk.idx;
        const others=r.cells.filter((c,i)=>c&&c.ok&&i!==bi).map(c=>c.price).sort((a,b)=>a-b);
        if(others.length<3) return;
        const m=others.length>>1, med=others.length%2?others[m]:(others[m-1]+others[m])/2;
        const gap=(pk.price/med-1)*100;
        if(gap<gapMin) return;
        if(q&&!((r.s.desc||'')+' '+e.home_team+' '+e.away_team).toLowerCase().includes(q)) return;
        out.push({e,mk,r,pk,med,gap,n:others.length+1});
      });});
  });
  out.sort((a,b)=>b.gap-a.gap);
  out.slice(0,5).forEach(({e,mk,r,pk})=>{const l=shareLine(e,mk,{desc:r.s.desc,name:r.s.name,point:r.point},pk.price,pk.book); if(!SHARE.includes(l)) SHARE.push(l);});
  if(!out.length) return `<div class="empty"><h3>No standout prop prices right now</h3>No over/under at $${maxOdds.toFixed(2)} or less${myName()} is ${gapMin}%+ above the other bookies. Try a lower min gap, or check after the next update.</div>`;
  const rows=out.slice(0,60).map(({e,mk,r,pk,med,gap,n})=>`<tr>
    <td class="c-edge"><span class="evp">+${gap.toFixed(1)}%</span><small style="display:block;color:var(--muted);font-size:12px">vs others</small></td>
    <td class="c-bet">${esc(r.s.desc||'')} <span class="pt">${esc(r.s.name)} ${r.point}</span><br><span class="bk">${esc(PROP_LABEL[mk]||mk)}${r.fair?' · edge '+((pk.price/r.fair-1)*100>0?'+':'')+((pk.price/r.fair-1)*100).toFixed(1)+'%':''}</span></td>
    <td class="c-price"><b>${pk.price.toFixed(2)}</b> <span class="bk">${esc(bkName(pk.book))}</span></td>
    <td class="c-fair others">${med.toFixed(2)} <span class="bk">(${n-1} others)</span></td>
    <td class="c-game">${esc(e.home_team)} v ${esc(e.away_team)}<br><span class="bk">${esc(e.sport_title)} · ${when(e.commence_time)}</span></td></tr>`).join('');
  return `<div class="ev topev"><div class="ev-head"><div><div class="ev-title">Prop picks under $${maxOdds.toFixed(2)}${esc(myName())}</div>
    <div class="ev-meta">${myBook==='all'?'One bookie well above the rest':'Priced well above the other bookies'}, biggest gap first. ${out.length>60?'Top 60 of '+out.length:out.length+' found'}.</div></div></div>
    <div class="tbl-wrap"><table class="bb ppt"><tr><th>Gap</th><th>Bet</th><th>Best price</th><th>Others pay</th><th>Game</th></tr>${rows}</table></div></div>`;
}

  $('list').innerHTML=`<div class="ev topev"><div class="ev-head"><div><div class="ev-title">Prop movers</div>
    <div class="ev-meta">Biggest moves first. ${out.length>60?'Top 60 of '+out.length:out.length+' found'}.</div></div></div>
    <div class="tbl-wrap"><table class="bb mvt"><tr><th>Move</th><th>Bet</th><th>Opened → now</th><th>Best now</th><th>Game</th></tr>${rows}</table></div></div>`;
}
$('evtSel').onchange=e=>{evType=e.target.value;store.set('evType',evType);render();};
$('mvSel').onchange=e=>{mvMode=e.target.value;store.set('mvMode',mvMode);render();};

/* ---------- check a price: type a bet you've found (e.g. on bet365) and see the edge vs fair ---------- */
let CHK={q:'',sel:null,price:''}, CHK_IDX=null;
function chkIndex(){
  const O=DATA.odds,P=DATA.props||{events:[]},now=new Date(),out=[];
  O.events.concat(P.events).forEach(e=>{
    if(new Date(e.commence_time)<=now) return;
    const mks=[...new Set(e.bookmakers.flatMap(b=>b.markets.map(m=>m.key)))].filter(k=>!k.endsWith('_lay'));
    mks.forEach(mk=>{const t=eventRows(e,mk); if(!t) return;
      t.rows.forEach(r=>{ if(!r.fair) return;
        const lbl=MKT_LABEL[mk]||PROP_LABEL[mk]||mk;
        const name=r.s.desc?`${r.s.desc} ${r.s.name} ${r.point}`:`${r.s.name}${r.point!=null?' '+fmtPt(mk,r.point):''}`;
        out.push({id:e.id+'|'+mk+'|'+r.s.key, name, lbl, e, r, text:(name+' '+lbl+' '+e.home_team+' '+e.away_team).toLowerCase()});
      });});
  });
  return out;
}
function renderCheck(){
  $('sports').innerHTML=''; $('q').parentElement&&($('q').hidden=true);
  $('legend').textContent='Found a price at bet365 (or anywhere)? Search the bet, type the price you’re being offered, and see the edge vs the fair price (Pinnacle where available, otherwise the Aussie market). Fair is for the main line only, so make sure the line matches.';
  if(!CHK_IDX) CHK_IDX=chkIndex();
  $('list').innerHTML=`<div class="chk">
    <h3>Check a price</h3>
    <div><label>1. Find the bet (player or team)</label><input id="chkQ" type="search" placeholder="e.g. Gafford, Jokic rebounds, Lakers" autocomplete="off" value="${esc(CHK.q)}"></div>
    <div class="chk-res" id="chkRes"></div>
    <div class="chk-row"><div><label>2. Price you're offered</label><input id="chkP" type="number" inputmode="decimal" step="0.01" min="1.01" placeholder="e.g. 1.74" value="${esc(CHK.price)}"></div>
      <div><label>Stake (optional)</label><input id="chkS" type="number" inputmode="decimal" placeholder="$" value=""></div></div>
    <div id="chkOut"></div></div>`;
  const draw=()=>{
    const q=CHK.q.trim().toLowerCase();
    const terms=q.split(/\s+/).filter(Boolean);
    const hits=terms.length?CHK_IDX.filter(x=>terms.every(t=>x.text.includes(t))).slice(0,12):[];
    $('chkRes').innerHTML=hits.map(x=>`<button data-id="${esc(x.id)}" class="${CHK.sel===x.id?'on':''}">${esc(x.name)} <span class="pt">${esc(x.lbl)}</span><span class="bk">${esc(x.e.home_team)} v ${esc(x.e.away_team)} · ${when(x.e.commence_time)} · fair ${x.r.fair.toFixed(2)}${x.r.fairSrc==='pin'?' (PIN)':''} · best ${isFinite(x.r.best)?x.r.best.toFixed(2)+' '+(x.r.bestBook?bkName(x.r.bestBook):''):'–'}</span></button>`).join('')
      ||(q?'<div class="bk" style="color:var(--muted)">No match. Try just the surname, or the team.</div>':'');
    $('chkRes').querySelectorAll('button').forEach(b=>b.onclick=()=>{CHK.sel=b.dataset.id;draw();});
    const x=CHK_IDX.find(y=>y.id===CHK.sel), p=parseFloat($('chkP').value), st=parseFloat($('chkS').value);
    if(!x){$('chkOut').innerHTML='';return;}
    if(!(p>1)){$('chkOut').innerHTML=`<div class="verdict"><b class="big">Fair ${x.r.fair.toFixed(2)}</b><p>${esc(x.name)} (${esc(x.lbl)}). Anything above <b>${x.r.fair.toFixed(2)}</b> is +EV. Enter the price you're offered.</p></div>`;return;}
    const edge=(p/x.r.fair-1)*100, good=edge>0;
    const ev=st>0?` Expected ${good?'profit':'loss'} on $${st.toFixed(0)}: <b>$${Math.abs(st*edge/100).toFixed(2)}</b>.`:'';
    const breakeven=(100/p).toFixed(1);
    $('chkOut').innerHTML=`<div class="verdict ${good?'good':'bad'}"><b class="big">${good?'+':''}${edge.toFixed(1)}% ${good?'value':'no value'}</b>
      <p>${esc(x.name)} (${esc(x.lbl)}) @ <b>${p.toFixed(2)}</b> vs fair <b>${x.r.fair.toFixed(2)}</b>${x.r.fairSrc==='pin'?' from Pinnacle':' from the Aussie market'}. Needs to land ${breakeven}% to break even; fair chance is ${(100/x.r.fair).toFixed(1)}%.${ev}${edge>0&&edge<2?' Thin edge, small stake.':''}${edge>15?' Big gap: check the line matches and there’s no injury news.':''}</p></div>`;
  };
  $('chkQ').oninput=e=>{CHK.q=e.target.value;CHK.sel=null;draw();};
  $('chkP').oninput=e=>{CHK.price=e.target.value;draw();};
  $('chkS').oninput=draw;
  draw();
}
function renderArbs(){
  const O=DATA.odds, P=DATA.props||{events:[]};
  const evs=O.events.concat(P.events);
  const counts={}; evs.forEach(e=>counts[e.sport_title]=1);
  if(sport!=='all'&&!counts[sport]) sport='all';
  $('sports').innerHTML=[['all'],...Object.keys(counts).map(k=>[k])].map(([k])=>
    `<button class="chip ${k===sport?'on':''}" data-s="${esc(k)}">${k==='all'?'All sports':esc(k)}</button>`).join('');
  $('sports').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{sport=b.dataset.s;store.set('sport',sport);render();});
  $('q').placeholder='Search team or player';
  $('legend').textContent='Arbs: bet every side at the bookies shown and you profit whatever happens. Stakes are split so every outcome pays the same. Prices are from the last update and arbs vanish fast, so confirm every leg is still there (same line) before betting. Watch for different void rules if a player is scratched, and bookies may limit accounts that arb a lot. Betfair left out (commission).';
  const q=$('q').value.trim().toLowerCase();
  $('list').innerHTML=arbsHTML(evs.filter(e=>sport==='all'||e.sport_title===sport),q);
}
function arbsHTML(evs,q){
  const T=Math.max(1,parseFloat($('bstake').value)||100);
  const arbs=findArbs(evs).filter(a=>myBook==='all'||a.legs.some(l=>l.book.key===myBook)).filter(a=>!q||(a.desc+' '+a.ev.home_team+' '+a.ev.away_team).toLowerCase().includes(q)).slice(0,30);
  arbs.slice(0,3).forEach(a=>SHARE.push(`ARB +${a.margin.toFixed(1)}%: `+a.legs.map(l=>`${a.desc?a.desc+' ':''}${l.name}${l.point!=null?' '+fmtPt(a.mk,l.point):''} @ $${l.price.toFixed(2)} (${bkName(l.book)})`).join(' + ')+`\n   ${a.ev.sport_title} · ${shortTeam(a.ev.home_team)} v ${shortTeam(a.ev.away_team)}`));
  if(!arbs.length) return '<div class="empty" style="padding:18px 22px"><b style="color:var(--text)">No arbs right now.</b> They pop up most on player props, so check again after the next update.</div>';
  const rows=arbs.map(a=>{
    const ret=T/a.sum;
    const legs=a.legs.map(l=>`<span class="leg"><b>$${(T*(1/l.price)/a.sum).toFixed(2)}</b> on ${a.desc?esc(a.desc)+' ':''}${esc(l.name)}${l.point!=null?' '+fmtPt(a.mk,l.point):''} @ <b>${l.price.toFixed(2)}</b> <span class="bk">${esc(bkName(l.book))}</span></span>`).join('');
    return `<tr><td class="conv c-edge">+${a.margin.toFixed(2)}%<small>$${(ret-T).toFixed(2)} profit</small></td><td class="c-bet">${legs}</td>
      <td class="c-game"><span class="leg">${esc(a.ev.home_team)} v ${esc(a.ev.away_team)}</span><span class="bk">${esc(a.ev.sport_title)} · ${esc(MKT_LABEL[a.mk]||PROP_LABEL[a.mk]||a.mk)} · ${when(a.ev.commence_time)}</span></td></tr>`;
  }).join('');
  return `<div class="ev topev"><div class="ev-head"><div><div class="ev-title">Arbitrage plays${myBook==='all'?'':esc(' with a '+(BOOK_NAMES[myBook]||SHORT[myBook]||myBook)+' leg')}</div>
    <div class="ev-meta">Guaranteed profit if every leg is still there. ${arbs.length} found · stakes for $${T.toFixed(0)} total</div></div></div>
    <div class="tbl-wrap"><table class="bb arbt"><tr><th>Profit</th><th>Bets (split your stake)</th><th>Game</th></tr>${rows}</table></div></div>`;
}
$('views').querySelectorAll('button').forEach(b=>b.onclick=()=>{view=b.dataset.v;store.set('view',view);sport='all';$('q').value='';render();});
$('movers').onchange=e=>{movers=e.target.checked;store.set('movers',movers);render();};
$('q').oninput=render;
</script>
