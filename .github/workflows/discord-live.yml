name: Discord live tracker

# Live NBA prop tracking in Discord #live-tracker and #founder-tracker (founder picks only) (scripts/discord_live.py): one message per game edited
# every minute with each alerted bet's progress, plus a live wins/losses tally for the day.
# GitHub often fires the cron only ~hourly, so each run loops up to 55 min (a newer run cancels it); a run with no games in play exits
# in seconds. Covers 5am-7pm Melbourne (all NBA tip-offs incl. weekend matinees). Public repo: minutes are free.
# Needs secrets: NBA_STATS_KEY, ODDS_ALERTS_KEY, DISCORD_BOT_TOKEN, DISCORD_GUILD_ID.
on:
  schedule:
    - cron: "*/30 18-23,0-8 * * *"
  workflow_dispatch:
    inputs:
      once:
        description: "One pass only (test)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: discord-live
  cancel-in-progress: true   # a newer run takes over the loop

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 62
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Track live bets
        env:
          NBA_STATS_KEY: ${{ secrets.NBA_STATS_KEY }}
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          MINUTES: "55"
          ONCE: ${{ inputs.once && '1' || '0' }}
        run: |
          pip install -q cryptography
          mkdir -p odds-data
          git fetch -q --depth=1 origin odds-data && git show FETCH_HEAD:bet_log.json > odds-data/bet_log.json && (git show FETCH_HEAD:botd.json > odds-data/botd.json || true)
          python scripts/discord_live.py
