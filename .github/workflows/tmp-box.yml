name: tmp box
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.NBA_STATS_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          def g(u):
              return json.load(urllib.request.urlopen(urllib.request.Request("https://api.balldontlie.io/v1"+u,headers={"Authorization":os.environ["K"]})))
          games=g("/games?dates[]=2026-11-11&per_page=100")["data"]
          want={"Mobley","Johnson","Walsh","White"}
          for gm in games:
              h,v=gm["home_team"]["abbreviation"],gm["visitor_team"]["abbreviation"]
              if not ({h,v}&{"NYK","CLE","BOS","TOR","IND","WAS"}): continue
              print("GAME",v,gm["visitor_team_score"],"@",h,gm["home_team_score"],gm["status"])
              st=g(f"/stats?game_ids[]={gm['id']}&per_page=100")["data"]
              for r in st:
                  p=r["player"]
                  if p["last_name"] in want:
                      print(" ",p["first_name"],p["last_name"],r["team"]["abbreviation"],"min",r["min"],"pts",r["pts"],"reb",r["reb"],"ast",r["ast"],"fg",f'{r["fgm"]}/{r["fga"]}',"3p",f'{r["fg3m"]}/{r["fg3a"]}',"ft",f'{r["ftm"]}/{r["fta"]}',"pf",r["pf"])
          PY
