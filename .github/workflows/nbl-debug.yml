name: NBL debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.APISPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          r=urllib.request.Request("https://v1.basketball.api-sports.io/games?league=1&season=2026-2027&date=2026-11-13&timezone=Australia/Sydney",headers={"x-apisports-key":os.environ["K"]})
          for x in json.load(urllib.request.urlopen(r))["response"]: print(x["id"],x["date"],x["status"],x["teams"]["home"]["name"],x["scores"]["home"]["total"],x["teams"]["away"]["name"],x["scores"]["away"]["total"])
          r=urllib.request.Request("https://v1.basketball.api-sports.io/games?live=all",headers={"x-apisports-key":os.environ["K"]})
          for x in json.load(urllib.request.urlopen(r))["response"]: print("LIVE",x["id"],x["league"]["name"],x["status"],x["teams"]["home"]["name"],x["teams"]["away"]["name"])
          PY
