name: NBL debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.APISPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          def api(p):
              r=urllib.request.Request("https://v1.basketball.api-sports.io"+p,headers={"x-apisports-key":os.environ["K"]})
              return json.load(urllib.request.urlopen(r,timeout=30))
          j=api("/games?id=501239"); g=j["response"][0]; print(g["teams"])
          for t in (g["teams"]["home"]["id"],g["teams"]["away"]["id"]):
              for s in ("2026-2027","2026"):
                  j=api(f"/players?team={t}&season={s}"); print(t,s,j.get("errors"),j.get("results")); 
                  for p in j.get("response",[])[:30]: print("  ",json.dumps(p)[:200])
          PY
