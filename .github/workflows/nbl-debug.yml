name: NBL debug
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          K: ${{ secrets.APISPORTS_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          def api(p):
              r=urllib.request.Request("https://v1.basketball.api-sports.io"+p,headers={"x-apisports-key":os.environ["K"]})
              return json.load(urllib.request.urlopen(r,timeout=30))
          g=api("/games?league=1&season=2026-2027&date=2026-11-13&timezone=Australia/Sydney")
          print("games errors",g.get("errors"))
          ids=[]
          for x in g["response"]:
              print(x["id"],x["status"],x["teams"]["home"]["name"],x["teams"]["away"]["name"]); ids.append(x["id"])
          for q in ["/games/statistics/players?ids="+"-".join(map(str,ids)),"/games/statistics/players?id=%s"%ids[0] if ids else "/status","/games/statistics/players?game=%s"%ids[0] if ids else "/status","/games/statistics/teams?id=%s"%ids[0] if ids else "/status"]:
              j=api(q); print(q.split("?")[0],q.split("?")[1][:12],"errors",j.get("errors"),"results",j.get("results"))
              if j.get("response"): print(json.dumps(j["response"][0])[:600])
          PY
