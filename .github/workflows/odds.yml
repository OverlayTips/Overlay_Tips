name: Update odds

# Every 5 minutes 6am-10pm Melbourne, every 15 minutes overnight (Odds API 5M plan), started by the "Odds ticker" workflow: game odds every run,
# player props re-pulled every 30 min. Claude scheduled tasks still start runs for the picks alerts, and the
# NBA/NBL pre-tip checks start quick sport-only refreshes. "Run workflow" in the Actions tab refreshes any time.
on:
  workflow_dispatch:
    inputs:
      fresh_props:
        description: "Re-pull every game's player props now (ignore the 2-hour cache)"
        type: boolean
        default: false
      nba_only:
        description: "NBA only (pre-tip refresh after lineups confirm; other sports keep their last odds)"
        type: boolean
        default: false
      only:
        description: "Only these sports, comma separated (e.g. basketball_nbl); other sports keep their last odds"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      PW_SET: ${{ secrets.ODDS_PAGE_PASSWORD != '' }}
      PROPS_EVERY_HOURS: ${{ (inputs.nba_only || inputs.only != '') && '0.25' || (inputs.fresh_props && '0' || '0.5') }}
      ONLY: ${{ inputs.only || (inputs.nba_only && 'basketball_nba' || '') }}
    steps:
      - name: Check run
        run: echo "RUN=true" >> "$GITHUB_ENV"   # every trigger runs (schedule is every 15 min)

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - name: Load previous data
        if: env.RUN == 'true'
        run: |
          git fetch --depth=1 origin odds-data && git worktree add odds-data FETCH_HEAD || mkdir -p odds-data
          # NBA injury report + confirmed starters (written by the NBA alerts workflow)
          mkdir -p alerts-state lineups-data
          git fetch -q --depth=1 origin alerts-state && git show FETCH_HEAD:state.json > alerts-state/state.json || echo "no injury data"
          git fetch -q --depth=1 origin lineups-data && git show FETCH_HEAD:lineups.json > lineups-data/lineups.json || echo "no lineups data"

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.12"

      - name: Fetch odds
        if: env.RUN == 'true' && env.PW_SET == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_PAGE_PASSWORD: ${{ secrets.ODDS_PAGE_PASSWORD }}
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
          NBA_STATS_KEY: ${{ secrets.NBA_STATS_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          pip install -q cryptography
          python scripts/fetch_odds.py

      - name: Instant value-bet alerts
        if: env.RUN == 'true' && env.PW_SET == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_MEMBER_TOPIC: ${{ secrets.NTFY_MEMBER_TOPIC }}
          UPDATE_PING: "1"   # status ping to Jayden's own channel after every update
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}        # members' app alerts (web push)
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}   # alerts into the Discord channels
          DEVIL_BOT_TOKEN: ${{ secrets.DEVIL_BOT_TOKEN }}   # optional: devil's advocate threads post as their own bot
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          pip install -q pywebpush || true
          python scripts/value_alerts.py

      - name: Odds Fantasy (rounds, multipliers, scoring -> Supabase)
        if: env.RUN == 'true' && env.PW_SET == 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          NBA_STATS_KEY: ${{ secrets.NBA_STATS_KEY }}
        run: python scripts/fantasy.py

      - name: Bet log (closing-price CLV, results, daily report)
        if: env.RUN == 'true' && env.PW_SET == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}   # daily report goes to Jayden's channel only
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
          ODDS_PAGE_PASSWORD: ${{ secrets.ODDS_PAGE_PASSWORD }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}   # daily results into Discord #results
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python scripts/bet_log.py

      - name: Discord roles (members' roles follow their plan)
        if: env.RUN == 'true'
        continue-on-error: true
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python scripts/discord_roles.py

      - name: Discord welcome DMs (new members)
        if: env.RUN == 'true'
        continue-on-error: true
        env:
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python scripts/discord_welcome.py

      - name: Discord giveaways (draw any that have ended)
        if: env.RUN == 'true'
        continue-on-error: true
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python scripts/discord_giveaway.py draw-due

      - name: Racing record (racing picks graded at Betfair SP)
        if: env.RUN == 'true' && env.PW_SET == 'true'
        continue-on-error: true
        env:
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
        run: python scripts/racing_log.py

      - name: Wipe unprotected data (no ODDS_PAGE_PASSWORD secret yet)
        if: env.RUN == 'true' && env.PW_SET != 'true'
        run: |
          rm -f odds-data/*.json
          echo '{"v":0,"locked":"no-password"}' > odds-data/data.json
          echo "::warning::Add the ODDS_PAGE_PASSWORD secret to start publishing odds"

      - name: Publish to odds-data branch
        if: env.RUN == 'true'
        run: |
          cd odds-data
          rm -rf .git-tmp && git init -q -b odds-data .git-tmp
          cp data.json .git-tmp/
          if [ -f picks.json ] && [ "$PW_SET" = "true" ]; then cp picks.json .git-tmp/; fi
          if [ -f hot.json ]; then cp hot.json .git-tmp/; fi   # free public Hot stats page
          if [ -f lines.json ]; then cp lines.json .git-tmp/; fi   # members Live page (encrypted)
          if [ -f alerted.json ]; then cp alerted.json .git-tmp/; fi   # value alerts already sent
          if [ -f bet_log.json ]; then cp bet_log.json .git-tmp/; fi   # tracker's own bet log (encrypted)
          if [ -f record.json ]; then cp record.json .git-tmp/; fi     # public Tracker record page (started bets only)
          if [ -f racing_log.json ]; then cp racing_log.json .git-tmp/; fi         # racing picks log (encrypted)
          if [ -f racing_record.json ]; then cp racing_record.json .git-tmp/; fi   # public Racing record (past races only)
          if [ -f discord_state.json ]; then cp discord_state.json .git-tmp/; fi   # who the Discord bot has welcomed (encrypted)
          if [ -f botd.json ]; then cp botd.json .git-tmp/; fi         # public Bet of the day (home page)
          if [ -f nbl_players.json ]; then cp nbl_players.json .git-tmp/; fi   # bet tracker NBL name search
          if [ -f nfl_players.json ]; then cp nfl_players.json .git-tmp/; fi   # bet tracker NFL name search
          cd .git-tmp
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Odds snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odds-data:odds-data
