name: Update odds

# 3 updates a day (Sydney time), each started by a Claude scheduled task that waits for it and then
# sends a picks alert: 6:45am "Early odds picks", 9:13am "Morning odds picks", 5:45pm "Daily odds picks".
# Use "Run workflow" in the Actions tab for an extra refresh any time.
on:
  workflow_dispatch:
    inputs:
      fresh_props:
        description: "Re-pull every game's player props now (ignore the 2-hour cache)"
        type: boolean
        default: false
      nba_only:
        description: "NBA only (pre-tip refresh after lineups confirm; other sports keep their last odds)"
        type: boolean
        default: false
      only:
        description: "Only these sports, comma separated (e.g. basketball_nbl); other sports keep their last odds"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    env:
      PW_SET: ${{ secrets.ODDS_PAGE_PASSWORD != '' }}
      PROPS_EVERY_HOURS: ${{ (inputs.nba_only || inputs.only != '') && '0.25' || (inputs.fresh_props && '0' || '2') }}
      ONLY: ${{ inputs.only || (inputs.nba_only && 'basketball_nba' || '') }}
    steps:
      - name: Check Sydney time
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "RUN=true" >> "$GITHUB_ENV"; exit 0; fi
          T=$(TZ=Australia/Sydney date +%H%M); echo "Sydney time $T"
          # allow for GitHub's scheduling delays; skip the cron that lands in the wrong daylight-saving hour
          if [ "$T" -ge 0645 ] && [ "$T" -le 0745 ]; then
            echo "RUN=true" >> "$GITHUB_ENV"
          else
            echo "RUN=false" >> "$GITHUB_ENV"; echo "Not an update slot in Sydney, skipping."
          fi

      - uses: actions/checkout@v4
        if: env.RUN == 'true'

      - name: Load previous data
        if: env.RUN == 'true'
        run: |
          git fetch --depth=1 origin odds-data && git worktree add odds-data FETCH_HEAD || mkdir -p odds-data
          # NBA injury report + confirmed starters (written by the NBA alerts workflow)
          mkdir -p alerts-state lineups-data
          git fetch -q --depth=1 origin alerts-state && git show FETCH_HEAD:state.json > alerts-state/state.json || echo "no injury data"
          git fetch -q --depth=1 origin lineups-data && git show FETCH_HEAD:lineups.json > lineups-data/lineups.json || echo "no lineups data"

      - uses: actions/setup-python@v5
        if: env.RUN == 'true'
        with:
          python-version: "3.12"

      - name: Fetch odds
        if: env.RUN == 'true' && env.PW_SET == 'true'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_PAGE_PASSWORD: ${{ secrets.ODDS_PAGE_PASSWORD }}
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
          NBA_STATS_KEY: ${{ secrets.NBA_STATS_KEY }}
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
        run: |
          pip install -q cryptography
          python scripts/fetch_odds.py

      - name: Instant value-bet alerts
        if: env.RUN == 'true' && env.PW_SET == 'true'
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_MEMBER_TOPIC: ${{ secrets.NTFY_MEMBER_TOPIC }}
          ODDS_ALERTS_KEY: ${{ secrets.ODDS_ALERTS_KEY }}
        run: python scripts/value_alerts.py

      - name: Wipe unprotected data (no ODDS_PAGE_PASSWORD secret yet)
        if: env.RUN == 'true' && env.PW_SET != 'true'
        run: |
          rm -f odds-data/*.json
          echo '{"v":0,"locked":"no-password"}' > odds-data/data.json
          echo "::warning::Add the ODDS_PAGE_PASSWORD secret to start publishing odds"

      - name: Publish to odds-data branch
        if: env.RUN == 'true'
        run: |
          cd odds-data
          rm -rf .git-tmp && git init -q -b odds-data .git-tmp
          cp data.json .git-tmp/
          if [ -f picks.json ] && [ "$PW_SET" = "true" ]; then cp picks.json .git-tmp/; fi
          if [ -f hot.json ]; then cp hot.json .git-tmp/; fi   # free public Hot stats page
          if [ -f lines.json ]; then cp lines.json .git-tmp/; fi   # members Live page (encrypted)
          if [ -f alerted.json ]; then cp alerted.json .git-tmp/; fi   # value alerts already sent
          if [ -f nbl_players.json ]; then cp nbl_players.json .git-tmp/; fi   # bet tracker NBL name search
          cd .git-tmp
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Odds snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odds-data:odds-data
