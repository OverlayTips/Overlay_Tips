name: Update odds

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (UTC). Each run costs ~3 credits per in-season sport.
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh

permissions:
  contents: write

concurrency:
  group: odds
  cancel-in-progress: false

jobs:
  odds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load previous data
        run: |
          git fetch --depth=1 origin odds-data && git worktree add odds-data FETCH_HEAD || mkdir -p odds-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/fetch_odds.py

      - name: Publish to odds-data branch
        run: |
          cd odds-data
          rm -rf .git-tmp && git init -q -b odds-data .git-tmp
          cp odds.json history.json .git-tmp/
          cd .git-tmp
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add odds.json history.json
          git commit -qm "Odds snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" odds-data:odds-data
