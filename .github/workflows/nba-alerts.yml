name: NBA alerts

# Confirmed starting lineups + injury news -> push to Jayden's phone (ntfy app), with a
# "Share to WhatsApp" button on each alert. GitHub only fires the cron roughly hourly, so each run
# loops for ~55 min, checking every 5 min (public repo, so Actions minutes are free). Covers ~6am-4pm
# Sydney time (AEDT): the US injury reports and every tip-off. Also publishes lineups.json for the site. Uses BALLDONTLIE only (no Odds API credits).
# Needs secrets: NBA_STATS_KEY (already set) and NTFY_TOPIC.
# "Run workflow" with test ticked sends a test push.
on:
  schedule:
    - cron: "0 19-23,0-4 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Just send a test push"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nba-alerts-${{ inputs.test && 'test' || 'live' }}
  cancel-in-progress: true   # a newer run takes over the polling loop

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for news + push (every 5 min for ~55 min)
        env:
          NBA_STATS_KEY: ${{ secrets.NBA_STATS_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE: st/state.json
          TEST: ${{ inputs.test && '1' || '0' }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          publish() {   # $1 = file in st/, $2 = branch
            rm -rf pub && mkdir pub && cp "st/$1" pub/ && cd pub && git init -q -b "$2" .
            git config user.name "odds-bot"; git config user.email "odds-bot@users.noreply.github.com"
            git add "$1" && git commit -qm "$2 $(date -u +%FT%TZ)" && git push -qf "$REPO_URL" "$2:$2"
            cd ..
          }
          mkdir -p st
          git fetch -q --depth=1 origin alerts-state && git show FETCH_HEAD:state.json > st/state.json || echo "no state yet"
          if [ "$TEST" = "1" ]; then python scripts/nba_alerts.py; exit 0; fi
          end=$(( $(date +%s) + 55*60 ))
          while :; do
            python scripts/nba_alerts.py || echo "::warning::check failed, retrying next loop"
            [ -f st/state.json ] && publish state.json alerts-state || true
            [ -f st/lineups.json ] && publish lineups.json lineups-data || true
            H=$(TZ=Australia/Sydney date +%H)
            if [ $(( $(date +%s) + 300 )) -ge $end ] || [ "$H" -ge 16 ] || [ "$H" -lt 6 ]; then break; fi
            sleep 300
          done
