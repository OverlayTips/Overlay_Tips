name: Update lineups

# NBA starting lineups + injury report for lineups.html (and the injury badges on hot.html).
# No odds API credits used. Every 15 min through the Aussie-morning tip-off window, hourly otherwise.
# Publishes lineups.json to the lineups-data branch.
on:
  schedule:
    - cron: "*/15 22,23 * * *"
    - cron: "*/15 0-5 * * *"
    - cron: "7 6-21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: lineups
  cancel-in-progress: false

jobs:
  lineups:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Load previous data
        run: git fetch --depth=1 origin lineups-data && git worktree add lineups-data FETCH_HEAD || mkdir -p lineups-data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch lineups and injuries
        env:
          OUT_DIR: lineups-data
        run: |
          pip install -q pdfplumber
          python scripts/lineups.py --debug

      - name: Publish to lineups-data branch
        run: |
          cd lineups-data
          rm -rf .git-tmp && git init -q -b lineups-data .git-tmp
          cp lineups.json .git-tmp/
          cd .git-tmp
          git config user.name "odds-bot"
          git config user.email "odds-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Lineups snapshot $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" lineups-data:lineups-data
