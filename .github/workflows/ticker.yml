name: Odds ticker

# Starts "Update odds" every 5 minutes 6am-10pm Melbourne, every 15 minutes overnight (24/7; overnight is slower to stay
# inside the Odds API 5M credits/month: ~600 credits a run with Pinnacle on every sport). GitHub's own 15-minute cron is unreliable (new schedules can take
# hours to start, and busy times skip runs), so this job loops for ~5h45m dispatching the update itself.
# The hourly "NBL pre-tip refresh" also starts this, so one is always queued behind the running one:
# when a ticker ends, the next takes over straight away.
on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: odds-ticker
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Start an odds update every 5 min (day) / 15 min (night)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          end=$(( $(date +%s) + 345*60 ))
          n=0
          while [ $(date +%s) -lt $end ]; do
            h=$(TZ=Australia/Melbourne date +%-H)
            if { [ $h -ge 6 ] && [ $h -lt 22 ]; } || [ $(( n % 3 )) -eq 0 ]; then   # day: every tick; 10pm-6am: every 3rd tick
              curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${{ github.repository }}/actions/workflows/odds.yml/dispatches" \
                -d '{"ref":"main"}' && echo "$(date -u +%H:%M) odds update started" || echo "::warning::dispatch failed"
            else
              echo "$(TZ=Australia/Melbourne date +%H:%M) overnight, skipping this tick"
            fi
            n=$(( n + 1 ))
            sleep 300
          done
