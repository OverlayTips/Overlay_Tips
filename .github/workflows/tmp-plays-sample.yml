name: tmp plays sample
on: workflow_dispatch
jobs:
  s:
    runs-on: ubuntu-latest
    steps:
      - env:
          K: ${{ secrets.NBA_STATS_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          def g(u):
              return json.load(urllib.request.urlopen(urllib.request.Request("https://api.balldontlie.io/v1"+u,headers={"Authorization":os.environ["K"]})))
          games=g("/games?dates[]=2026-11-11&per_page=100")["data"]
          live=[x for x in games if x.get("period")]
          print("live games",[(x["id"],x["visitor_team"]["abbreviation"],x["home_team"]["abbreviation"],x["period"],x.get("time"),x["status"]) for x in live])
          if live:
              p=g(f"/plays?game_id={live[0]['id']}&per_page=100")
              d=p["data"]; print("keys",list(d[0].keys()))
              for x in d[:100]:
                  t=x.get("text","")
                  if any(w in t.lower() for w in ("enter","sub","for ")) or x.get("type"): print(x.get("period"),x.get("clock"),repr(x.get("type")),t[:120])
              b=g(f"/box_scores/live")
              print("box keys", list((b.get("data") or [{}])[0].keys())[:30])
              pl=((b.get("data") or [{}])[0].get("home_team") or {}).get("players") or []
              print("player keys", list(pl[0].keys()) if pl else None)
          PY
