name: NBL pre-tip refresh

# Hourly through the Aussie afternoon/evening (3pm-midnight AEDT): if an NBL game tips in the next
# 15-80 min, run an NBL-only odds update so value picks + phone alerts land before the game.
# Costs 1 API-Sports call per run, and Odds API credits only when a game is coming up.
on:
  schedule:
    - cron: "40 4-13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/nbl_refresh.py
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          GH_TOKEN: ${{ github.token }}
