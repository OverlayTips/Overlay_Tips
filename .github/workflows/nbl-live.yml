name: NBL live

# NBL scoreboard + box scores for the members' Live page and bet tracker. API-Sports blocks Cloudflare's
# network, so GitHub fetches it (every 30s while a game is on) and publishes it encrypted to the
# nbl-live branch; the overlay-live Worker decrypts it for members. Started by "NBL pre-tip refresh".
# Needs secrets: APISPORTS_KEY and LIVE_PASSWORD (same value as LIVE_PASSWORD in Cloudflare).
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nbl-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 320
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll NBL (every 30s while a game is on)
        env:
          APISPORTS_KEY: ${{ secrets.APISPORTS_KEY }}
          LIVE_PASSWORD: ${{ secrets.LIVE_PASSWORD }}
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          OUT: nbl-live
          PUBLISH: >-
            rm -rf pub && mkdir pub && cp -r nbl-live/. pub/ && cd pub && git init -q -b nbl-live . &&
            git add -A && git -c user.name=odds-bot -c user.email=odds-bot@users.noreply.github.com commit -qm "nbl" &&
            git push -qf "$REPO_URL" nbl-live:nbl-live; cd ..
        run: |
          pip install -q cryptography
          python scripts/nbl_live.py loop
