name: Stats probe (temporary)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test player_stats
        shell: python
        run: |
          import sys, json; sys.path.insert(0, "scripts")
          from datetime import datetime, timezone
          import player_stats as ps
          now = datetime.now(timezone.utc); ts = now.replace(microsecond=0).isoformat().replace("+00:00","Z")
          names = ["Luka Dončić","LeBron James","C.J. McCollum","Shai Gilgeous-Alexander","Austin Reaves","Trae Young","Jalen Johnson","Kristaps Porzingis","Nobody Fake"]
          ev = {"sport_key":"basketball_nba","home_team":"Atlanta Hawks","away_team":"Los Angeles Lakers",
                "bookmakers":[{"key":"x","markets":[{"key":"player_points","outcomes":[{"name":"Over","description":n,"point":20.5,"price":1.9} for n in names]}]}]}
          out, note = ps.update(None, [ev], now, ts)
          print("NOTE", note); print("BY", out["by"]); print("IDS", len(out["ids"].get("map",{})))
          for k, v in out["players"].items():
              print(k, "->", v["n"], v["team"], len(v["g"]), "games; latest", v["g"][:3])
          print("BYTES", len(json.dumps(out)))
